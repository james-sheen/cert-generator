# The suite, and then the tool is actually run.
#
# The unit tests cover the builder, the scrubber and the architectural boundary
# without producing a document. That is most of the program and none of what this
# repository exists to do -- so the CLI runs afterwards against the examples, and
# the exit codes it returns are pinned.
#
# poppler is installed on purpose. Without it the projection tests skip, and a
# check that silently stopped running in the one place it matters is worse than no
# check at all -- so CERT_GENERATOR_REQUIRE_PDF_ORACLE turns that skip into a
# failure here.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not finding an oracle is not a pass. Both of these convert a skip into a red.
  CERT_GENERATOR_REQUIRE_PDF_ORACLE: "1"
  CERT_GENERATOR_REQUIRE_SEAM: "1"

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. `>=3.10` is a claim about five of them and exactly one was
  # ever run. In a sibling repository that gap hid two end-to-end tests that had
  # been erroring since 3.13, and every host this family is deployed on runs
  # 3.14.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The oracles, because this workflow's `env:` above converts a missing
      # one into a red for the whole file -- deliberately, since a projection
      # check that silently stopped running is worse than none. A matrix job
      # that skipped them would be green for the wrong reason on exactly the
      # interpreters nothing else runs.
      - name: The independent PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet -e '.[dev,verify]'
          # The engine behind the referee. The RANGE is read from this package's
          # own metadata and never restated here. This line used to carry
          # `>=0.1.0,<0.2` -- a range that never matched pyproject.toml even
          # before the break, and that went on installing a 0.1.x referee after
          # the package declared `>=0.2.0`. CI was testing a combination pip
          # would refuse to install for anybody else.
          REQ="$(python3 -c 'from importlib.metadata import requires; print(next(r.split(";")[0].strip() for r in requires("odm-cert-generator") if r.split(";")[0].strip().startswith("bmc-sensor-audit")))')"
          python3 -m pip install --quiet "bmc-sensor-audit[detect]${REQ#bmc-sensor-audit}"
          python3 -m pytest tests/ -q

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message step needs the commits in this push,
          # and the default depth of 1 would leave it checking only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The independent PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install, with the referee and the engine behind it
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[dev,verify]'
          # The engine behind the referee. The RANGE is read from this package's
          # own metadata and never restated here. This line used to carry
          # `>=0.1.0,<0.2` -- a range that never matched pyproject.toml even
          # before the break, and that went on installing a 0.1.x referee after
          # the package declared `>=0.2.0`. CI was testing a combination pip
          # would refuse to install for anybody else.
          REQ="$(python3 -c 'from importlib.metadata import requires; print(next(r.split(";")[0].strip() for r in requires("odm-cert-generator") if r.split(";")[0].strip().startswith("bmc-sensor-audit")))')"
          python3 -m pip install --quiet "bmc-sensor-audit[detect]${REQ#bmc-sensor-audit}"
          # The distribution, not the command: `pip show cert-generator` finds
          # nothing and, under `pipefail`, ends the step. This is what caught
          # the rename -- and it caught it after the release, because the
          # sweep that renamed everything else read `pyproject.toml`, `src/`
          # and `tests/` and never looked in here.
          python3 -m pip show odm-cert-generator | sed -n 's/^Version: /  odm-cert-generator  /p'
          python3 -m pip show bmc-sensor-audit | sed -n 's/^Version: /  referee         /p'
          python3 -m pip show arbiter-engine   | sed -n 's/^Version: /  engine          /p'

      - name: The suite
        run: python3 -m pytest tests/ -q

      - name: A unit with findings renders, and says so with exit 1
        run: |
          set -euo pipefail
          set +e
          cert-generator render \
            --attestation examples/attestation.json \
            --identity examples/identity.json \
            --coverage examples/coverage.json \
            --out-json /tmp/certificate.json \
            --out-pdf /tmp/certificate.pdf
          code=$?
          set -e
          test "${code}" -eq 1 || { echo "expected 1, got ${code}"; exit 1; }
          test -s /tmp/certificate.json
          test -s /tmp/certificate.pdf

      - name: The page matches the record
        run: cert-generator verify --certificate /tmp/certificate.json --pdf /tmp/certificate.pdf

      - name: The certificate does not claim a flat pass
        # A word-level check on the rendered PDF, not on the source. The source
        # is where the forbidden strings are DEFINED, so grepping it would find
        # them every time and prove nothing.
        run: |
          set -euo pipefail
          # Flattened first. The PDF wraps its own text, so the scope sentence
          # arrives split across two lines and a grep for the whole phrase would
          # never match -- a step that ships permanently red, or worse, one whose
          # positive assertions are quietly unreachable.
          pdftotext -layout /tmp/certificate.pdf - \
            | tr '\n' ' ' | tr -s ' ' > /tmp/certificate.txt
          for claim in "100%" "100 %" "fully compliant" "all clear" "passed all"; do
            if grep -qiF -- "${claim}" /tmp/certificate.txt; then
              echo "the certificate claims '${claim}'"; exit 1
            fi
          done
          grep -q "Not part of this judgment" /tmp/certificate.txt
          grep -q "declined and therefore not judged" /tmp/certificate.txt
          grep -q "Fan 3 Tach" /tmp/certificate.txt
          echo "  the denominator is on the page"

      - name: A shapeless artifact is refused, with exit 2 and no output
        # The non-vacuity check. Every run above is expected to succeed, so a
        # build that had broken into always writing a document would sail through
        # them. This one hands it something the validator must reject.
        run: |
          set -euo pipefail
          echo '{"format": "not-the-one"}' > /tmp/shapeless.json
          set +e
          cert-generator render \
            --attestation /tmp/shapeless.json \
            --identity examples/identity.json \
            --out-json /tmp/refused.json
          code=$?
          set -e
          test "${code}" -eq 2 || { echo "expected 2 (could not complete), got ${code}"; exit 1; }
          test ! -e /tmp/refused.json || { echo "a certificate was written from a refused artifact"; exit 1; }
          echo "  refused, and nothing was written"

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED
